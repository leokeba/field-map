services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: fieldmap
      POSTGRES_USER: fieldmap
      POSTGRES_PASSWORD: fieldmap-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fieldmap-postgres:/var/lib/postgresql/data
      - ./backend/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldmap -d fieldmap"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fieldmap-postgres:
