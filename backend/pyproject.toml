[project]
name = "field-map-api"
version = "0.1.0"
description = "Private collaborative field mapping API"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.16,<1",
  "pillow>=10.4,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
